name: AA311 Absolute Full OpenTherm
products:
  - id: pmwea6qvethn2wjr
    name: AA311.THERMOSTAT
entities:
  - entity: climate
    dps:
      - id: 2
        optional: true
        type: string
        name: hvac_mode
        mapping:
          # Order matters: writes use the first match for "off".
          # Tuya values: off means standby; standby means temporarily unused; holiday means vacation.
          - dps_val: manual
            value: heat
          - dps_val: auto
            value: auto
          - dps_val: "off"
            value: "off"
          - dps_val: standby
            value: "off"
          - dps_val: holiday
            value: "off"
      - id: 3
        optional: true
        type: integer
        name: temperature
        range:
          min: 50 # DP 140 lower limit: 5.0 C
          max: 400 # DP 139 upper limit: 40.0 C
        mapping:
          - scale: 10
      - id: 24
        optional: true
        type: integer
        name: current_temperature
        mapping:
          - scale: 10
      - id: 110
        optional: true
        type: boolean
        name: hvac_action
        mapping:
          - dps_val: true
            value: heating
          - dps_val: false
            value: idle

  - entity: number
    name: Temp Calibration
    category: config
    class: temperature
    icon: mdi:thermometer-minus
    dps:
      - id: 27
        optional: true
        type: integer
        name: value
        unit: C
        range:
          min: -90
          max: 90
        mapping:
          - scale: 10

  - entity: sensor
    name: Battery
    class: battery
    category: diagnostic
    dps:
      - id: 35
        optional: true
        type: integer
        name: sensor
        unit: "%"
        class: measurement

  - entity: lock
    name: Child Lock
    category: config
    dps:
      - id: 40
        optional: true
        type: boolean
        name: lock

  # Boost also requires writing DP 102 (a raw 4-byte little-endian timestamp in seconds).
  - entity: switch
    name: Boost Enable
    category: config
    dps:
      - id: 101
        optional: true
        type: boolean
        name: switch

  - entity: sensor
    name: Boost Timestamp
    category: diagnostic
    dps:
      - id: 102
        optional: true
        type: string
        name: sensor

  - entity: sensor
    name: Thermostat Address
    category: diagnostic
    dps:
      - id: 103
        optional: true
        type: string
        name: sensor

  - entity: sensor
    name: Boiler Water Flow
    category: diagnostic
    icon: mdi:water-pump
    dps:
      - id: 104
        optional: true
        type: integer
        name: sensor
        class: measurement
        mapping:
          - scale: 10

  - entity: switch
    name: External Temp Sensor Enable
    category: config
    dps:
      - id: 105
        optional: true
        type: boolean
        name: switch

  - entity: sensor
    name: Holiday Timestamp
    category: diagnostic
    dps:
      - id: 106
        optional: true
        type: string
        name: sensor

  - entity: number
    name: Freezing Temp
    category: config
    class: temperature
    icon: mdi:snowflake
    dps:
      - id: 107
        optional: true
        type: integer
        name: value
        unit: C
        range:
          min: 50
          max: 400
        mapping:
          - scale: 10

  # DP 109: false = heating, true = cooling. The switch is inverted so ON means heating.
  - entity: switch
    name: Heating Mode
    category: config
    icon: mdi:hvac
    dps:
      - id: 109
        optional: true
        type: boolean
        name: switch
        mapping:
          - dps_val: false
            value: true
          - dps_val: true
            value: false

  - entity: binary_sensor
    name: Boiler Flame Status
    category: diagnostic
    icon: mdi:fire
    dps:
      - id: 110
        type: boolean
        name: sensor

  - entity: sensor
    name: Outdoor Temp Probe
    class: temperature
    category: diagnostic
    dps:
      - id: 111
        optional: true
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10

  - entity: select
    name: Program Mode
    category: config
    dps:
      - id: 112
        optional: true
        type: string
        name: option
        mapping:
          - dps_val: "52day"
            value: "5+2 Days"
          - dps_val: "7day"
            value: "7 Days"
          - dps_val: "24hour"
            value: "24 Hours"

  - entity: binary_sensor
    name: OpenTherm Connected
    class: connectivity
    category: diagnostic
    dps:
      - id: 113
        type: boolean
        name: sensor

  # The override value only takes effect when DP 115 is also set to true.
  - entity: number
    name: Override Temp
    category: config
    class: temperature
    dps:
      - id: 114
        optional: true
        type: integer
        name: value
        unit: C
        range:
          min: 50
          max: 400
        mapping:
          - scale: 10

  - entity: switch
    name: Override Temp Enable
    category: config
    dps:
      - id: 115
        optional: true
        type: boolean
        name: switch

  - entity: select
    name: Backlight Time
    category: config
    icon: mdi:lightbulb-on
    dps:
      - id: 116
        optional: true
        type: integer
        name: option
        mapping:
          - dps_val: 5
            value: "5"
          - dps_val: 10
            value: "10"
          - dps_val: 15
            value: "15"
          - dps_val: 20
            value: "20"
          - dps_val: 30
            value: "30"

  - entity: number
    name: Hysteresis ON
    category: config
    dps:
      - id: 117
        optional: true
        type: integer
        name: value
        unit: C
        range:
          min: -100
          max: 100
        mapping:
          - scale: 10

  - entity: number
    name: Hysteresis OFF
    category: config
    dps:
      - id: 118
        optional: true
        type: integer
        name: value
        unit: C
        range:
          min: -100
          max: 100
        mapping:
          - scale: 10

  - entity: select
    name: Control Logic
    category: config
    dps:
      - id: 119
        optional: true
        type: string
        name: option
        mapping:
          - dps_val: Nor
            value: Normal
          - dps_val: TPI
            value: TPI
          - dps_val: OS
            value: Optimal Start

  - entity: select
    name: Boiler Work Mode
    category: config
    icon: mdi:heating-coil
    dps:
      - id: 120
        type: integer
        name: option
        mapping:
          - dps_val: 0
            value: "Off"
          - dps_val: 1
            value: "CH Only"
          - dps_val: 2
            value: "DHW Only"
          - dps_val: 3
            value: "CH + DHW"
          - dps_val: 17
            value: "CH Only"
          - dps_val: 18
            value: "DHW Only"
          - dps_val: 19
            value: "CH + DHW"

  - entity: sensor
    name: Boiler Type
    category: diagnostic
    dps:
      - id: 121
        type: string
        name: sensor

  # The dump reported false while the thermostat showed a temperature; verify this DP's meaning in practice.
  - entity: binary_sensor
    name: Thermostat Online Status
    class: connectivity
    category: diagnostic
    dps:
      - id: 122
        type: boolean
        name: sensor

  # DPs 125-132 report whole degrees Celsius without scaling.
  - entity: sensor
    name: CH Max Limit
    class: temperature
    category: diagnostic
    dps:
      - id: 125
        type: integer
        name: sensor
        unit: C

  - entity: sensor
    name: CH Min Limit
    class: temperature
    category: diagnostic
    dps:
      - id: 126
        type: integer
        name: sensor
        unit: C

  - entity: sensor
    name: DHW Max Limit
    class: temperature
    category: diagnostic
    dps:
      - id: 127
        type: integer
        name: sensor
        unit: C

  - entity: sensor
    name: DHW Min Limit
    class: temperature
    category: diagnostic
    dps:
      - id: 128
        type: integer
        name: sensor
        unit: C

  - entity: sensor
    name: CH Current Temp
    class: temperature
    category: diagnostic
    dps:
      - id: 129
        type: integer
        name: sensor
        unit: C
        class: measurement

  # These ranges reflect the boiler-reported limits in DPs 125-128.
  - entity: number
    name: CH Target Setpoint
    category: config
    class: temperature
    icon: mdi:thermometer-chevron-up
    dps:
      - id: 130
        type: integer
        name: value
        unit: C
        range:
          min: 40
          max: 80

  - entity: sensor
    name: DHW Current Temp
    class: temperature
    category: diagnostic
    dps:
      - id: 131
        type: integer
        name: sensor
        unit: C
        class: measurement

  - entity: number
    name: DHW Target Setpoint
    category: config
    class: temperature
    icon: mdi:water-boiler
    dps:
      - id: 132
        type: integer
        name: value
        unit: C
        range:
          min: 37
          max: 60

  - entity: sensor
    name: Boiler Pressure
    class: pressure
    category: diagnostic
    dps:
      - id: 133
        optional: true
        type: integer
        name: sensor
        unit: bar
        class: measurement
        mapping:
          - scale: 10

  - entity: sensor
    name: Boiler Error Code
    category: diagnostic
    dps:
      - id: 134
        type: integer
        name: sensor

  # Reset sends a pulse, so this is a button rather than a switch.
  - entity: button
    name: Boiler Reset
    category: config
    icon: mdi:restart
    dps:
      - id: 135
        type: boolean
        name: button

  - entity: number
    name: Thermostat Backlight Brightness
    category: config
    dps:
      - id: 136
        optional: true
        type: integer
        name: value
        range:
          min: 0
          max: 7

  # DP 137 was missing from the dump; Celsius units are assumed based on DPs 130 and 132.
  - entity: number
    name: Max CH Water Setting
    category: config
    class: temperature
    dps:
      - id: 137
        optional: true
        type: integer
        name: value
        unit: C
        range:
          min: 40
          max: 80

  - entity: switch
    name: DST Enable
    category: config
    dps:
      - id: 138
        optional: true
        type: boolean
        name: switch

  - entity: number
    name: Thermostat Target Temp High Limit
    category: config
    class: temperature
    dps:
      - id: 139
        optional: true
        type: integer
        name: value
        unit: C
        range:
          min: 50
          max: 400
        mapping:
          - scale: 10

  - entity: number
    name: Thermostat Target Temp Low Limit
    category: config
    class: temperature
    dps:
      - id: 140
        optional: true
        type: integer
        name: value
        unit: C
        range:
          min: 50
          max: 400
        mapping:
          - scale: 10
